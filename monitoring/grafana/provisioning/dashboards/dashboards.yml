# Auto-provisionamento de dashboards do Grafana.
# O Grafana carrega automaticamente os JSONs do diretório configurado.
apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
