---
- name: Provisionar Docker e subir o Agente RAG (backend + frontend)
  hosts: rag_agent
  become: true

  vars:
    local_project_path: "{{ playbook_dir }}/../"

  tasks:
    - name: Atualizar cache do apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar dependências para adicionar o repositório oficial do Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
        state: present

    - name: Criar diretório para chaves apt (padrão do Docker)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar a chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Descobrir a arquitetura do pacote Debian desta instância (arm64, amd64, etc)
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Adicionar o repositório oficial do Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Atualizar cache do apt após adicionar o repositório do Docker
      ansible.builtin.apt:
        update_cache: true

    - name: Instalar Docker Engine, CLI, containerd e plugin de Compose (v2)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Garantir que o serviço Docker está ativo e habilitado no boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuário ubuntu ao grupo docker (conveniência para uso manual futuro)
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Criar diretório do projeto no servidor
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Sincronizar o código do projeto (backend + frontend) para o servidor
      ansible.posix.synchronize:
        src: "/home/magno/challenge_k8s_pro/"
        dest: "/home/ubuntu/rag_agent/"
        private_key: "/home/magno/.ssh/id_rsa"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=terraform-iac"
          - "--exclude=kubernetes"
          - "--exclude=docs"
          - "--exclude=indice_faiss"
          - "--exclude=secrets"
          - "--exclude=.env"
      delegate_to: localhost

    - name: Criar diretório de segredos com permissão restrita
      ansible.builtin.file:
        path: "{{ project_dir }}/secrets"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Gravar o secret da senha do Postgres (não aparece em logs por causa do no_log)
      ansible.builtin.copy:
        content: "{{ vault_postgres_password }}"
        dest: "{{ project_dir }}/secrets/postgres_password.txt"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Gerar o arquivo .env a partir do template (com os segredos do Vault)
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ project_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true

    - name: Subir a stack completa (Postgres + aplicação) via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        build: always
        state: present

    - name: Aguardar o backend responder na porta configurada
      ansible.builtin.uri:
        url: "http://localhost:8000/health"
        status_code: 200
      register: health_check
      retries: 15
      delay: 5
      until: health_check.status == 200