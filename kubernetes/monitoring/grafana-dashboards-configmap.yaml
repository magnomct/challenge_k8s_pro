apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: challenge-k8s-pro
    app.kubernetes.io/managed-by: kubectl
data:
  rag-agent-overview.json: |
        {
          "annotations": {
            "list": []
          },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "links": [],
          "panels": [
            {
              "title": "Request Rate (req/s)",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "fillOpacity": 15,
                    "lineWidth": 2
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "expr": "sum(rate(http_requests_total{job=\"rag-agent\"}[1m])) by (handler, status)",
                  "legendFormat": "{{handler}} - {{status}}",
                  "refId": "A"
                }
              ]
            },
            {
              "title": "Latência P50 / P95 / P99",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "fillOpacity": 10,
                    "lineWidth": 2
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"rag-agent\"}[5m])) by (le, handler))",
                  "legendFormat": "p50 - {{handler}}",
                  "refId": "A"
                },
                {
                  "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"rag-agent\"}[5m])) by (le, handler))",
                  "legendFormat": "p95 - {{handler}}",
                  "refId": "B"
                },
                {
                  "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"rag-agent\"}[5m])) by (le, handler))",
                  "legendFormat": "p99 - {{handler}}",
                  "refId": "C"
                }
              ]
            },
            {
              "title": "Uploads de PDF",
              "type": "stat",
              "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      },
                      {
                        "color": "yellow",
                        "value": 50
                      },
                      {
                        "color": "red",
                        "value": 100
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "expr": "rag_uploads_total",
                  "legendFormat": "Total Uploads",
                  "refId": "A"
                }
              ]
            },
            {
              "title": "Perguntas - In Scope vs Out of Scope",
              "type": "piechart",
              "gridPos": {
                "h": 8,
                "w": 6,
                "x": 6,
                "y": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "targets": [
                {
                  "expr": "rag_questions_total{scope=\"in_scope\"}",
                  "legendFormat": "Dentro do Escopo",
                  "refId": "A"
                },
                {
                  "expr": "rag_questions_total{scope=\"out_of_scope\"}",
                  "legendFormat": "Fora do Escopo",
                  "refId": "B"
                }
              ]
            },
            {
              "title": "Latência do Agente RAG",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "fillOpacity": 10,
                    "lineWidth": 2
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "expr": "rate(rag_response_latency_seconds_sum{job=\"rag-agent\"}[5m]) / rate(rag_response_latency_seconds_count{job=\"rag-agent\"}[5m])",
                  "legendFormat": "Latência Média",
                  "refId": "A"
                },
                {
                  "expr": "histogram_quantile(0.95, rate(rag_response_latency_seconds_bucket{job=\"rag-agent\"}[5m]))",
                  "legendFormat": "P95",
                  "refId": "B"
                }
              ]
            },
            {
              "title": "Distância FAISS (melhor match)",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 16
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "fillOpacity": 20,
                    "lineWidth": 2,
                    "drawStyle": "points",
                    "pointSize": 5
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "expr": "rate(rag_faiss_distance_sum{job=\"rag-agent\"}[5m]) / rate(rag_faiss_distance_count{job=\"rag-agent\"}[5m])",
                  "legendFormat": "Distância Média",
                  "refId": "A"
                }
              ]
            },
            {
              "title": "PostgreSQL - Conexões Ativas",
              "type": "timeseries",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 16
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "fillOpacity": 10,
                    "lineWidth": 2
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "expr": "pg_stat_activity_count{job=\"postgres\"}",
                  "legendFormat": "{{datname}} - {{state}}",
                  "refId": "A"
                }
              ]
            }
          ],
          "schemaVersion": 39,
          "tags": [
            "rag-agent",
            "observability"
          ],
          "templating": {
            "list": [
              {
                "current": {
                  "selected": false,
                  "text": "Prometheus",
                  "value": "Prometheus"
                },
                "hide": 0,
                "includeAll": false,
                "name": "DS_PROMETHEUS",
                "options": [],
                "query": "prometheus",
                "refresh": 1,
                "regex": "",
                "type": "datasource"
              }
            ]
          },
          "time": {
            "from": "now-1h",
            "to": "now"
          },
          "timepicker": {},
          "timezone": "browser",
          "title": "RAG Agent - Overview",
          "uid": "rag-agent-overview",
          "version": 1
        }
