apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-agent
  labels:
    app.kubernetes.io/name: rag-agent
    app.kubernetes.io/version: "v2.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: challenge-k8s-pro
    app.kubernetes.io/managed-by: kubectl
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-agent
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-agent
        app.kubernetes.io/version: "v2.0"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: challenge-k8s-pro
        app.kubernetes.io/managed-by: kubectl
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: rag-agent
          image: rag-agent:v2.0
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-agent-secrets
                  key: nvidia-api-key
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: rag-agent-config
                  key: postgres-host
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: rag-agent-config
                  key: postgres-port
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: rag-agent-config
                  key: postgres-user
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: rag-agent-config
                  key: postgres-db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-agent-secrets
                  key: postgres-password
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
