# docker-compose.yml — desenvolvimento local
# Sobe o backend FastAPI + PostgreSQL + stack de observabilidade com um único comando.
#
# Uso:
#   docker compose up -d --build
#   Swagger:    http://localhost:8000/docs
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000 (admin/admin)

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag_agent_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_agent}
      POSTGRES_USER: ${POSTGRES_USER:-rag_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/rag-agent/db-init:/docker-entrypoint-initdb.d:ro

    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_min_duration_statement=2000"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

    security_opt:
      - no-new-privileges:true

    networks:
      - rag_network

  app:
    build:
      context: ./apps/backend/rag-agent
      dockerfile: Dockerfile
    container_name: rag_agent_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    security_opt:
      - no-new-privileges:true

    networks:
      - rag_network

  # ---------------------------------------------------------------------------
  # Observabilidade
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: rag_agent_prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    ports:
      - "9090:9090"

    depends_on:
      - app

    security_opt:
      - no-new-privileges:true

    networks:
      - rag_network

  grafana:
    image: grafana/grafana:11.6.0
    container_name: rag_agent_grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    security_opt:
      - no-new-privileges:true

    networks:
      - rag_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: rag_agent_postgres_exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-rag_app}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-rag_agent}?sslmode=disable"

    ports:
      - "9187:9187"

    depends_on:
      postgres:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    networks:
      - rag_network

volumes:
  postgres_data:
    name: rag_agent_postgres_data
  prometheus_data:
    name: rag_agent_prometheus_data
  grafana_data:
    name: rag_agent_grafana_data

networks:
  rag_network:
    name: rag_agent_network
    driver: bridge
