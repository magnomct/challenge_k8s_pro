# docker-compose.yml — desenvolvimento local
# Sobe o backend FastAPI + PostgreSQL com um único comando.
#
# Uso:
#   docker compose up -d --build
#   Swagger: http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag_agent_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_agent}
      POSTGRES_USER: ${POSTGRES_USER:-rag_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/rag-agent/db-init:/docker-entrypoint-initdb.d:ro

    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_min_duration_statement=2000"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

    security_opt:
      - no-new-privileges:true

    networks:
      - rag_network

  app:
    build:
      context: ./apps/backend/rag-agent
      dockerfile: Dockerfile
    container_name: rag_agent_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    security_opt:
      - no-new-privileges:true

    networks:
      - rag_network

volumes:
  postgres_data:
    name: rag_agent_postgres_data

networks:
  rag_network:
    name: rag_agent_network
    driver: bridge
