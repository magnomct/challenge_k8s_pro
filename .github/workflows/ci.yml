# CI/CD Pipeline — Build, Push e Deploy
# Roda a cada push na branch main e em pull requests.
#
# Jobs:
#   1. lint       — Verifica qualidade do código Python (ruff)
#   2. build-push — Build da imagem Docker + push para GHCR (somente main)
#   3. deploy     — Atualiza a aplicação na VM OCI via Ansible (somente main)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rag-agent

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: Verificar formatação
        run: ruff format --check apps/backend/rag-agent/

      - name: Verificar linting
        run: ruff check apps/backend/rag-agent/

  # ---------------------------------------------------------------------------
  # Job 2: Build e Push da imagem Docker
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend/rag-agent
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 3: Deploy na OCI (somente main)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (Ansible → OCI)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Instalar Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install -r terraform-iac/ansible/requirements.yml

      - name: Criar Vault password file
        run: echo "${{ secrets.VAULT_PASSWORD }}" > /tmp/vault_pass.txt

      - name: Executar playbook de deploy
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          cd terraform-iac/ansible
          ansible-playbook playbook.yml \
            --vault-password-file /tmp/vault_pass.txt \
            -i inventory.ini

      - name: Limpar credenciais
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa /tmp/vault_pass.txt
