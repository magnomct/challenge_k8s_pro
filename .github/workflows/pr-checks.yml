# Validação de Pull Requests
# Roda a cada PR para garantir qualidade antes do merge.
#
# Jobs:
#   1. lint         — Verifica qualidade do código Python (ruff)
#   2. build        — Build da imagem Docker (sem push)
#   3. validate-k8s — Validação dos manifests Kubernetes

name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: Verificar formatação
        run: ruff format --check apps/backend/rag-agent/

      - name: Verificar linting
        run: ruff check apps/backend/rag-agent/

  # ---------------------------------------------------------------------------
  # Job 2: Build Docker (sem push — apenas valida que o Dockerfile funciona)
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker (dry-run)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend/rag-agent
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 3: Validação dos manifests Kubernetes
  # ---------------------------------------------------------------------------
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar manifests com kustomize
        run: kubectl kustomize kubernetes/ > /dev/null
